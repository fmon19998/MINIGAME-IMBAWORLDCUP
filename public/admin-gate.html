<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Gate - IMBAWORLD CUP</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="member-page admin-gate-page">
  <div id="toast" class="toast hidden"></div>
  <main class="member-shell">
    <section class="member-card login-member glow-card admin-gate-card">
      <img src="/assets/logo.png" alt="IMBAWORLD CUP" class="login-logo" />
      <p class="eyebrow">PRIVATE ADMIN GATE</p>
      <h1>Masuk Area Admin</h1>
      <p class="muted">Masukkan admin access key dulu. Member tidak bisa melihat form login dashboard tanpa key ini.</p>
      <form id="adminGateForm" class="form-grid compact-form admin-gate-form">
        <label>Admin Access Key
          <input type="password" name="key" placeholder="Masukkan key admin" autocomplete="off" required />
        </label>
        <button class="btn primary full" type="submit">Buka Dashboard Admin</button>
      </form>
      <div class="member-notes">
        <strong>Default lokal:</strong> IMBA-ADMIN-2026. Ganti lewat file <code>.env</code> sebelum online.
      </div>
      <div class="hero-actions center-actions">
        <a class="btn secondary" href="/member">Kembali ke Web Player</a>
      </div>
    </section>
  </main>
  <script src="/js/admin-gate.js"></script>
</body>
</html>
